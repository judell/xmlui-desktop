[package]
name = "bram"
version = "0.6.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
notify = "8.2.0"
tiny_http = "0.12"
include_dir = "0.7"
ureq = "2"
libc = "0.2"
similar = "2"
sqlformat = "0.3"
loomweave-scanner = "=1.4.0"
flate2 = { version = "=1.1.9", default-features = false, features = ["miniz_oxide"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
time = { version = "0.3.54", features = ["parsing"] }
uuid = { version = "1", features = ["v4"] }

# bram-guard-authority-flip: serde_json parses transcript lines on the
# guard's deny path, and debug is the shipping format — at opt-level 0 the
# scan ran ~3x slower than the Python guard's C json on the same payload.
# Optimize just this dependency in dev builds; the reverse tail scan in
# guard_policy fixes the algorithmic half.
[profile.dev.package.serde_json]
opt-level = 3
